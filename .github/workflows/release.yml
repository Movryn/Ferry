name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          gh release create "v$version" bukkit/build/libs/*.jar --title "Ferry $version" --notes "$NOTES" --target "$GITHUB_SHA"
